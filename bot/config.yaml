# Les mots-clés, contrats et salons Discord de chaque personne sont dans profiles.yaml.

sources:
  adzuna: false
  email_alerts: true                   # true une fois IMAP_* ajoutés dans les secrets GitHub (boîte d'alertes dédiée)
  labonnealternance: false             # passer à true une fois LBA_API_KEY rempli dans .env
  carrieres: true                      # pages carrières (API publiques Greenhouse, Lever…), voir plus bas

labonnealternance:
  rayon_km: 30                         # arrondi par l'API à 10, 30, 60 ou 100
  romes:                               # codes métier ROME (à vérifier sur France Travail « métierscope »)
    - B1301                            # Décoration d'espaces / design
    - E1205                            # Réalisation de contenus multimédias

email_alerts:
  jours: 3                             # relit les mails des N derniers jours (doublons écartés par la base)

sante:
  silence_max_heures: 48               # alerte #bot-logs si un expéditeur attendu se tait plus longtemps
  expediteurs: []                      # liste vide : pas de surveillance des mails

# Page web perso (voir src/jobbot/site.py) : réécrit offres.js à chaque passage du profil `profil`.
# `dossier` = dossier de la page sur le VPS (relatif à la racine du bot, ou chemin absolu).
site:
  profil: stage-design
  dossier: ..                          # racine du dépôt (là où est index.html), voir .github/workflows/bot.yml
  score_proche: 60                     # score ≥ → affichées d'emblée ; en dessous : « Voir N autres offres »
  conserver_jours: 21                  # une offre plus revue depuis N jours disparaît de la page
  git_push: true                       # true : `dossier` est un clone git de la page, offres.js y est poussé

notifications:
  discord: false                       # pas de Discord : la page web est la sortie
  ntfy: false
  max_par_execution: 30                # garde-fou anti-spam (messages individuels)
  recap_a_partir_de: 8                 # ≥ N offres pour un profil dans un passage → un récapitulatif
  max_par_recap: 60                    # offres au plus dans un récapitulatif (la suite au passage suivant)

# Pages carrières d'entreprises ciblées (API publiques de leur outil de recrutement, sans clé).
# ats : greenhouse | lever | ashby | workable | recruitee | smartrecruiters
# id  : identifiant de l'entreprise dans l'outil (dans l'URL de sa page offres).
# Liste vérifiée le 2026-11-18 (offres à Paris/Lille présentes). Ajouter une ligne = une entreprise.
carrieres:
  intervalle_minutes: 60               # au plus un passage par heure
  entreprises:
    # --- Lille / métropole (mode, design, culture) ---
    - {nom: Kiabi, ats: smartrecruiters, id: kiabi}               # Hem / Lille, mode et création
    - {nom: Exotec, ats: workable, id: exotec}                    # Croix, design produit
    # --- Paris : mode, luxe, mobilier, édition, culture ---
    - {nom: Back Market, ats: ashby, id: backmarket}
    - {nom: Believe, ats: smartrecruiters, id: believe}           # musique, direction artistique
    - {nom: Doctolib, ats: ashby, id: doctolib}                   # design produit / UX
    - {nom: Alan, ats: ashby, id: alan}
    - {nom: Qonto, ats: ashby, id: qonto}
    - {nom: Pennylane, ats: ashby, id: pennylane}
    - {nom: Malt, ats: lever, id: malt}
    - {nom: Swile, ats: lever, id: swile}
    - {nom: BlaBlaCar, ats: lever, id: blablacar}
    - {nom: Brevo, ats: lever, id: brevo}
    - {nom: Contentsquare, ats: lever, id: contentsquare}
    - {nom: Mirakl, ats: greenhouse, id: mirakl}
    - {nom: Algolia, ats: greenhouse, id: algolia}
    - {nom: Withings, ats: workable, id: withings}
    # --- Europe : design, mode, culture ---
    - {nom: Spotify, ats: lever, id: spotify}                     # Stockholm
    - {nom: Typeform, ats: greenhouse, id: typeform}              # Barcelone
    - {nom: Miro, ats: greenhouse, id: realtimeboardglobal}
    - {nom: Adyen, ats: greenhouse, id: adyen}
