[project]
name = "jobbot"
version = "0.1.0"
description = "Bot alertes offres Data/SQL Lille + Paris (Discord / ntfy)"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "imap-tools>=1.16.0",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
jobbot = "jobbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
